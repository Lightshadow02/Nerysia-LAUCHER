appId: 'fr.nerysia.launcher'
productName: 'Nerysia Launcher'
artifactName: 'Nerysia-Launcher-setup-${version}.${ext}'  # sans espace : le paquet .pacman gardait un point a la place

copyright: 'Copyright © 2026 Nerysia'

asar: true
compression: 'maximum'

files:
  - '!{dist,.gitignore,.vscode,docs,dev-app-update.yml,.nvmrc,.eslintrc.json,tools,.github,.claude,CLAUDE.md}'

# Windows Configuration
win:
  target:
    - target: 'nsis'
      arch: 'x64'

nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true

# macOS Configuration
# Pas de certificat Apple : app signee "ad-hoc" par build/mac-adhoc-sign.js (sinon elle
# ne demarre pas sur Apple Silicon). Nom sans espace + arch : utilise par uicore.js
# pour le lien de mise a jour (pas de MAJ auto sur Mac sans certificat).
mac:
  target:
    - target: 'dmg'
      arch:
        - 'x64'
        - 'arm64'
  artifactName: 'Nerysia-Launcher-setup-${version}-${arch}.${ext}'
  category: 'public.app-category.games'
  identity: null

afterPack: './build/mac-adhoc-sign.js'

# Linux Configuration
# AppImage : toutes distributions + MAJ auto. deb : Ubuntu/Debian/Mint. pacman : Arch/Manjaro/EndeavourOS.
linux:
  target:
    - 'AppImage'
    - 'deb'
    - 'pacman'
  maintainer: 'Hugo Loureiro <loureirohugo70@gmail.com>'
  vendor: 'Nerysia'
  synopsis: 'Launcher Minecraft Nerysia (Cobblemon)'
  description: 'Launcher officiel du serveur Nerysia. Mods, configurations et mises à jour sont téléchargés automatiquement.'
  category: 'Game'

publish:
  provider: github
  owner: Lightshadow02
  repo: Nerysia-LAUCHER
  # Publie directement la release (par defaut electron-builder cree un brouillon,
  # invisible pour la mise a jour automatique du launcher).
  releaseType: release

directories:
  buildResources: 'build'
  output: 'dist'
