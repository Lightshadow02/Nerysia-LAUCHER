appId: 'fr.nerysia.launcher'
productName: 'Nerysia Launcher'
artifactName: '${productName}-setup-${version}.${ext}'

copyright: 'Copyright © 2026 Nerysia'

asar: true
compression: 'maximum'

files:
  - '!{dist,.gitignore,.vscode,docs,dev-app-update.yml,.nvmrc,.eslintrc.json,tools,.github,.claude}'

# Windows Configuration
win:
  target:
    - target: 'nsis'
      arch: 'x64'

nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true

# Linux Configuration
linux:
  target: 'AppImage'
  maintainer: 'Hugo Loureiro <loureirohugo70@gmail.com>'
  vendor: 'Nerysia'
  synopsis: 'Launcher Minecraft Nerysia (Cobblemon)'
  description: 'Launcher officiel du serveur Nerysia. Mods, configurations et mises à jour sont téléchargés automatiquement.'
  category: 'Game'

publish:
  provider: github
  owner: Lightshadow02
  repo: Nerysia-LAUCHER

directories:
  buildResources: 'build'
  output: 'dist'
