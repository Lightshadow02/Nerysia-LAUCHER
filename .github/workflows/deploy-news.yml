name: Deploy News (feed.xml)

# Quand ça se déclenche :
#  1. À chaque push sur master qui touche docs/feed.xml → auto
#  2. Manuellement via le bouton "Run workflow" sur GitHub
on:
  push:
    branches: [master]
    paths:
      - 'docs/feed.xml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Upload feed.xml to FTP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install lftp
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lftp

      - name: Upload feed.xml via FTP
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_PROTOCOL: ${{ secrets.FTP_PROTOCOL }}
        run: |
          if [ -z "$FTP_HOST" ] || [ -z "$FTP_USER" ] || [ -z "$FTP_PASS" ]; then
            echo "::error::Secrets FTP_HOST / FTP_USERNAME / FTP_PASSWORD manquants."
            exit 1
          fi

          # Sanitize : enleve un prefixe protocole eventuel (ftp://, sftp://, https://...) et slash final
          CLEAN_HOST=$(echo "$FTP_HOST" | sed -E 's|^[a-z]+://||I' | sed 's|/$||')
          PROTO="${FTP_PROTOCOL:-ftp}"
          PORT_SUFFIX=""
          if [ -n "$FTP_PORT" ]; then
            PORT_SUFFIX=":$FTP_PORT"
          fi
          URL="$PROTO://$CLEAN_HOST$PORT_SUFFIX"

          echo "=== Diagnostic ==="
          echo "Host (sanitise) : $CLEAN_HOST"
          echo "Protocole       : $PROTO"
          echo "Port            : ${FTP_PORT:-(defaut $PROTO)}"
          echo "User length     : ${#FTP_USER}"
          echo "Password length : ${#FTP_PASS}"
          echo "URL finale      : $PROTO://***@$CLEAN_HOST$PORT_SUFFIX"
          echo "=================="

          # Test resolution DNS d'abord
          echo ""
          echo "Test resolution DNS de $CLEAN_HOST :"
          if getent hosts "$CLEAN_HOST"; then
            echo "  -> DNS OK"
          else
            echo "::error::DNS resolution failed pour $CLEAN_HOST. Verifie que FTP_HOST est correct (ex: 'apk.nerysia.fr' sans http:// ni slash)."
            exit 1
          fi

          echo ""
          echo "=== Upload via lftp ==="
          lftp -u "$FTP_USER,$FTP_PASS" -e "
            set net:timeout 30;
            set net:max-retries 3;
            set net:reconnect-interval-base 5;
            set ftp:passive-mode on;
            set ftp:prefer-epsv no;
            set ftp:ssl-allow yes;
            set ftp:ssl-force no;
            set ftp:ssl-protect-data yes;
            set ssl:verify-certificate no;
            debug 3;
            echo \"--- Listing root pour verifier connexion ---\";
            ls;
            echo \"--- Listing /apk/ ---\";
            cd /apk && ls;
            echo \"--- Listing /apk/nerysia-laucher/ ---\";
            cd /apk/nerysia-laucher && ls;
            echo \"--- Upload feed.xml ---\";
            put docs/feed.xml;
            echo \"--- Verification post-upload ---\";
            ls feed.xml;
            bye
          " "$URL" 2>&1

      - name: Confirm
        run: echo "✓ feed.xml deployed to ${{ secrets.FTP_HOST }}:/apk/nerysia-laucher/feed.xml"
