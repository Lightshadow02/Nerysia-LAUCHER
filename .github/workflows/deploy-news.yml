name: Deploy News (feed.xml)

# Quand ça se déclenche :
#  1. À chaque push sur master qui touche docs/feed.xml → auto
#  2. Manuellement via le bouton "Run workflow" sur GitHub
on:
  push:
    branches: [master]
    paths:
      - 'docs/feed.xml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Upload feed.xml to FTP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install lftp
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lftp

      - name: Upload feed.xml via FTP
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -z "$FTP_HOST" ] || [ -z "$FTP_USER" ] || [ -z "$FTP_PASS" ]; then
            echo "::error::Secrets FTP_HOST / FTP_USERNAME / FTP_PASSWORD manquants. Ajoute-les dans Settings → Secrets and variables → Actions."
            exit 1
          fi
          lftp -u "$FTP_USER,$FTP_PASS" -e "
            set ftp:ssl-allow yes;
            set ssl:verify-certificate no;
            cd /apk/nerysia-laucher;
            put docs/feed.xml;
            bye
          " "$FTP_HOST"

      - name: Confirm
        run: echo "✓ feed.xml deployed to ${{ secrets.FTP_HOST }}:/apk/nerysia-laucher/feed.xml"
