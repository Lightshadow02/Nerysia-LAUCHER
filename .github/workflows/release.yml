name: Build & Release

# Un seul tag vX.Y.Z pousse = build + publication automatique pour TOUTES les plateformes :
#   Windows (.exe) / macOS Intel + Apple Silicon (.dmg) / Linux (.AppImage, .deb, .pacman pour Arch)
#
# Rattrapage (un systeme a echoue) : Actions -> Build & Release -> Run workflow,
# avec le tag (ex : v1.0.7) et le systeme a refaire. Le code construit est celui du tag.
# Attention : electron-builder n'ajoute des fichiers a une release publiee que pendant 2 h.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag a reconstruire (ex : v1.0.7)"
        required: true
      systeme:
        description: "Systeme a reconstruire"
        type: choice
        options: [mac, windows, linux, tout]
        default: mac
      machine_mac:
        description: "Machine Mac (l'Intel fait aussi le .dmg Apple Silicon ; macos-15 = Apple Silicon, souvent saturee)"
        type: choice
        options: [macos-15-intel, macos-15]
        default: macos-15-intel

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Mac = macos-15-intel : les machines Mac Apple Silicon de GitHub (macos-15, macos-latest)
        # sont saturees depuis nov. 2026 ("Due to capacity constraints...") et le build etait annule
        # apres 15 min sans machine ("not acquired by Runner"). La machine Intel demarre tout de suite
        # et fabrique aussi le .dmg Apple Silicon (arm64). Image Intel maintenue par GitHub jusqu'a
        # aout 2027 environ : repasser alors sur macos-15 / macos-latest.
        os: ${{ fromJSON(
          github.event_name != 'workflow_dispatch' && '["windows-latest","macos-15-intel","ubuntu-latest"]' ||
          inputs.systeme == 'mac' && format('["{0}"]', inputs.machine_mac) ||
          inputs.systeme == 'windows' && '["windows-latest"]' ||
          inputs.systeme == 'linux' && '["ubuntu-latest"]' ||
          format('["windows-latest","{0}","ubuntu-latest"]', inputs.machine_mac)) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40

    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      # electron-builder publie avec la version de package.json, pas celle du tag.
      # On bloque si les deux ne correspondent pas (sinon on republie l'ancienne version).
      - name: Check tag matches package.json version
        shell: bash
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "v${PKG_VERSION}" != "${RELEASE_TAG}" ]; then
            echo "::error::Le tag ${RELEASE_TAG} ne correspond pas a package.json (v${PKG_VERSION}). Mets a jour la version dans package.json avant de tagger."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Le paquet Arch (.pacman) a besoin de bsdtar
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools

      - name: Build & publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist -- -p always
